services:
  # Skillzy Express Backend API
  - type: web
    name: skillzy-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        value: mongodb+srv://skillswap:Lokesh123@cluster0.sdddbc9.mongodb.net/?appName=Cluster0
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_ID
        value: admin@communityexchange.com
      - key: ADMIN_PASS
        value: Admin@12345
